name: pricepatrol

services:
  app:
    # 默认直接使用已发布的 AMD64/ARM64 镜像，不在服务器上构建。
    # 如需本机构建，请参照 README 先执行 docker build，再覆盖 IMAGE。
    image: ${IMAGE:-ghcr.io/lwhx/pricepatrol:latest}
    pull_policy: always
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 1gb
    # 对外发布宿主机 6300 端口，容器内部仍使用 3000 端口。
    # 未限定宿主机 IP，Docker 默认绑定所有网络接口。
    ports:
      - "6300:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      COLLECTION_CONCURRENCY: ${COLLECTION_CONCURRENCY:-1}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请先在.env配置持久ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pricepatrol-data:/app/data
      - pricepatrol-backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/status',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pricepatrol-data:
    # 旧部署已用 price-monitor-data 卷时，在 .env 写 DATA_VOLUME=price-monitor-data 继续读取原数据。
    name: ${DATA_VOLUME:-pricepatrol-data}
  pricepatrol-backups:
    name: ${BACKUP_VOLUME:-pricepatrol-backups}

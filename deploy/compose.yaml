# 价巡 PricePatrol 部署文件
#
# 只需要本目录三个文件即可在 Linux 上运行，不必克隆整个仓库、也不在服务器上构建：
#   deploy/compose.yaml  deploy/.env.example
# 以及你自己生成的 .env（不要提交）。
#
# 1) cp deploy/.env.example deploy/.env  然后填 ENCRYPTION_KEY
#    生成密钥：openssl rand -hex 32
# 2) docker compose -f deploy/compose.yaml --env-file deploy/.env pull
# 3) docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
#
# 默认向所有网络接口发布 6300 端口；请使用防火墙控制访问，
# 如经 HTTPS 反向代理访问，请将 COOKIE_SECURE 设为 true。

name: pricepatrol

services:
  app:
    # 建议固定已通过 CI 的 sha- 标签，避免 latest 自动漂移。
    # 公开镜像：ghcr.io/lwhx/pricepatrol:latest
    # 私有镜像需先 docker login ghcr.io
    image: ${IMAGE:-ghcr.io/lwhx/pricepatrol:latest}
    # 每次启动时检查新镜像；如需固定版本，请在 .env 中设置 sha- 标签。
    pull_policy: always
    # 部署文件在 deploy/ 下，镜像已包含前端与后端，因此不需要 build。
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 1gb
    # 对外发布宿主机 6300 端口，容器内部仍使用 3000 端口。
    # 未限定宿主机 IP，Docker 默认绑定所有网络接口。
    ports:
      - "6300:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请先在 .env 配置持久 ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pricepatrol-data:/app/data
      - pricepatrol-backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/status',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pricepatrol-data:
    name: ${DATA_VOLUME:-pricepatrol-data}
  pricepatrol-backups:
    name: ${BACKUP_VOLUME:-pricepatrol-backups}
